<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>하반기 국외연수 장소 2차 투표</title>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <style>
    :root{--navy:#071f55;--gold:#b67720;--bg:#f6efe4;--ink:#172033;}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:sans-serif;padding-bottom:50px}
    .wrap{width:min(600px,calc(100% - 20px));margin:auto}
    .hero{background:#071f55;color:#fff;padding:40px 0;text-align:center;border-bottom:4px solid var(--gold)}
    .card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 10px 25px rgba(0,0,0,.05);margin-top:20px}
    .btn{border:0;border-radius:12px;padding:12px 20px;font-weight:900;cursor:pointer}
    .btn.gold{background:var(--gold);color:#fff}
    /* 랭킹/투표 아이템 스타일 */
    .vote-item{background:#fff;border:2px solid #e8e8e8;border-radius:15px;padding:15px;margin-bottom:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:all 0.2s}
    .vote-item:hover{border-color:var(--gold)}
    .vote-item.selected{border-color:#16a34a;background:#f0fdf4}
    .vote-item .title{font-weight:900;font-size:16px;color:var(--navy)}
    .vote-item .score{font-weight:950;color:var(--gold)}
    .my-badge{display:none;background:#16a34a;color:#fff;font-size:11px;padding:2px 6px;border-radius:4px;margin-left:8px}
    .selected .my-badge{display:inline-block}
  </style>
</head>
<body>
  <header class="hero">
    <div class="wrap"><h1>하반기 국외연수 장소 투표</h1></div>
  </header>
  <main class="wrap">
    <section class="card">
      <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
        <h2>실시간 현황</h2>
        <button class="btn" id="refreshBtn" type="button">새로고침</button>
      </div>
      <div id="voteList"></div>
    </section>
    <section class="admin card" id="adminPanel" style="display:none;">
      <h3>관리자 관리</h3>
      <button class="btn" id="resetVotesBtn" style="background:#dc2626; color:white;">투표 전체 초기화</button>
    </section>
  </main>
  <div id="toast" style="position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:black; color:white; padding:10px 20px; border-radius:20px; display:none;"></div>

<script>
const FIREBASE_CONFIG = { /* 이전과 동일하게 유지 */ };
const APP_PATH = "snu17_trip_vote_2026_round2";
const $ = id => document.getElementById(id);
let currentUser = null, votes = {}, dynamicDestinations = [];

async function toggleVote(id) {
  if(!currentUser) { alert('로그인이 필요합니다.'); return; }
  const myVote = votes[currentUser.id]?.choices[0]?.optionId;
  
  try {
    if(myVote === id) {
      await firebase.database().ref(`${APP_PATH}/votes/${currentUser.id}`).remove();
      delete votes[currentUser.id];
      toast('투표가 취소되었습니다.');
    } else {
      const rec = {memberId:currentUser.id, choices:[{optionId:id}], updatedAt:new Date().toISOString()};
      await firebase.database().ref(`${APP_PATH}/votes/${currentUser.id}`).set(rec);
      votes[currentUser.id] = rec;
      toast('투표가 저장되었습니다.');
    }
    renderList();
  } catch(err) { alert('처리 실패'); }
}

function renderList() {
  const myVote = votes[currentUser?.id]?.choices[0]?.optionId;
  const list = $('voteList');
  list.innerHTML = dynamicDestinations.map(d => {
    const score = Object.values(votes).filter(v => v.choices[0].optionId === d.id).length;
    const isSelected = myVote === d.id;
    return `
      <div class="vote-item ${isSelected ? 'selected' : ''}" onclick="toggleVote('${d.id}')">
        <div>
          <span class="title">${d.num}. ${d.title}</span>
          ${isSelected ? '<span class="my-badge">내 선택</span>' : ''}
        </div>
        <span class="score">${score}명</span>
      </div>
    `;
  }).join('');
}

// 명단 및 Firebase 초기화 생략 (전과 동일 로직 사용)
async function init() {
  firebase.initializeApp(FIREBASE_CONFIG);
  firebase.auth().signInAnonymously();
  const db = firebase.database();
  
  db.ref(`${APP_PATH}/settings/destinations`).on('value', s => { 
    dynamicDestinations = s.val() || []; renderList(); 
  });
  db.ref(`${APP_PATH}/votes`).on('value', s => { 
    votes = s.val() || {}; renderList(); 
  });
}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2000);}
init();
</script>
</body>
</html>
