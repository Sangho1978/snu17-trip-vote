const voterRoster = () => ROSTER.filter(u => !u.viewerOnly);
let reportDb=null, reportSettings={}, reportVotes={}, reportDestinations=[...INITIAL_DESTINATIONS];
const $=id=>document.getElementById(id);
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function validVote(rec){return rec && Array.isArray(rec.choices) && rec.choices[0] && rec.choices[0].optionId;}
function showError(msg){$('errorBox').style.display='block';$('errorBox').textContent=msg;}
function clearError(){$('errorBox').style.display='none';$('errorBox').textContent='';}
function fmtTime(){return new Date().toLocaleString('ko-KR',{hour12:false});}
async function waitFirebase(timeout=8000){const s=Date.now();while(!window.firebase && Date.now()-s<timeout)await new Promise(r=>setTimeout(r,100));if(!window.firebase)throw new Error('Firebase SDK 로드 실패');}
async function connect(){await waitFirebase();if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);if(firebase.auth&&!firebase.auth().currentUser)await firebase.auth().signInAnonymously();reportDb=firebase.database();return reportDb;}
function compute(){const active=reportDestinations&&reportDestinations.length?reportDestinations:INITIAL_DESTINATIONS;const map={};active.forEach((d,i)=>map[d.id]={...d,num:d.num||i+1,voters:[]});const doneIds=new Set();Object.values(reportVotes||{}).forEach(rec=>{if(!validVote(rec))return;const member=ROSTER.find(u=>u.id===rec.memberId);if(member&&member.viewerOnly)return;const optionId=rec.choices[0].optionId;if(!map[optionId])map[optionId]={id:optionId,num:999,title:optionId,shortTitle:optionId,voters:[]};map[optionId].voters.push({name:rec.name||(member&&member.name)||rec.memberId||'',org:rec.org||(member&&member.org)||'',memberId:rec.memberId||'',updatedAt:rec.updatedAt||''});if(rec.memberId)doneIds.add(rec.memberId);});const roster=voterRoster();const pending=roster.filter(u=>!doneIds.has(u.id));const done=roster.filter(u=>doneIds.has(u.id)).length;const list=Object.values(map).sort((a,b)=>(b.voters.length-a.voters.length)||((a.num||999)-(b.num||999))||String(a.title).localeCompare(String(b.title),'ko'));list.forEach(d=>d.voters.sort((a,b)=>String(a.name).localeCompare(String(b.name),'ko')));return {total:roster.length,done,pending,list};}
function render(){const data=compute();const rate=data.total?Math.round(data.done/data.total*100):0;$('totalCount').textContent=data.total;$('doneCount').textContent=data.done;$('pendingCount').textContent=data.total-data.done;$('rateCount').textContent=rate+'%';const max=Math.max(1,...data.list.map(d=>d.voters.length));$('barWrap').innerHTML=data.list.map(d=>`<div class="bar-row"><div class="bar-label">${escapeHtml(d.title)}</div><div class="bar-bg"><div class="bar" style="width:${Math.round(d.voters.length/max*100)}%"></div></div><b>${d.voters.length}명</b></div>`).join('');$('destGrid').innerHTML=data.list.map(d=>{const meta=[d.subtitle||d.rankLabel,d.duration].filter(Boolean).join(' · ');const voters=d.voters.length?`<ol>${d.voters.map(v=>`<li><b>${escapeHtml(v.name)}</b> <span class="org">${escapeHtml(v.org)}</span></li>`).join('')}</ol>`:'<div class="empty">선택자 없음</div>';return `<article class="dest"><div class="dest-head"><div><div class="dest-title">${escapeHtml(d.num)}. ${escapeHtml(d.title)}</div><div class="dest-meta">${escapeHtml(meta)}</div></div><div class="count">${d.voters.length}명</div></div><div class="list">${voters}</div></article>`;}).join('');$('pendingList').textContent=data.pending.length?data.pending.map(u=>`${u.name}(${u.org||''})`).join(' · '):'미응답자 없음';$('status').textContent=`최종 갱신: ${fmtTime()} · Firebase 경로: ${APP_PATH}`;}
async function loadData(){clearError();$('status').textContent='Firebase 연결 중...';try{await connect();const snap=await reportDb.ref(APP_PATH).once('value');const root=snap.val()||{};reportSettings=root.settings||{};const saved=reportSettings.destinations||reportSettings.candidates;reportDestinations=Array.isArray(saved)&&saved.length?saved:INITIAL_DESTINATIONS;reportVotes=root.votes||{};render();}catch(err){console.error(err);showError('데이터를 불러오지 못했습니다.\n\n'+(err&&err.code?err.code+': ':'')+(err&&err.message?err.message:String(err))+'\n\nFirebase Rules, Anonymous 인증, APP_PATH를 확인해 주세요.');$('status').textContent='Firebase 연결 실패';}}
window.addEventListener('DOMContentLoaded',loadData);
</script></body></html>
